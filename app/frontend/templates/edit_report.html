{% extends "base.html" %}

{% block title %}Редактировать заявку — CityHelp{% endblock %}

{% block content %}

<a href="/reports/{{ report.id }}" class="back">← Назад к заявке</a>

<div class="page-header" style="text-align:center;">
  <h1 class="page-title">Редактировать заявку</h1>
  <p class="page-subtitle">Измените данные и сохраните</p>
</div>

{% if errors %}
  {% for e in errors %}
    <div class="alert alert-error">{{ e }}</div>
  {% endfor %}
{% endif %}

<div class="form-center">
  <div class="auth-card form-card">
    <form method="post" action="/reports/{{ report.id }}/edit">

      <div class="form-group">
        <label for="title">Заголовок</label>
        <input type="text" id="title" name="title"
              value="{{ form.title if form else report.title }}"
              required minlength="3" maxlength="100">
      </div>

      <div class="form-group">
        <label for="category_id">Категория</label>
        <select id="category_id" name="category_id" required>
          {% for category in categories %}
            <option value="{{ category.id }}"
              {% if (form and form.category_id == category.id) or (not form and report.category_id == category.id) %}
                selected
              {% endif %}>
              {{ category.name }}
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="address">Адрес</label>
        <input type="text" id="address" name="address"
               value="{{ form.address if form else report.address }}"
               required minlength="5" maxlength="255">
      </div>

      <div class="form-group">
        <label for="description">Описание</label>
        <textarea id="description" name="description"
                  required minlength="5" maxlength="1500">{{ form.description if form else report.description }}</textarea>
      </div>

      <div class="report-footer">
        <a href="/reports/{{ report.id }}" class="btn btn-ghost">Отмена</a>
        <button type="submit" class="btn btn-primary">Сохранить изменения</button>
      </div>

    </form>
  </div>
</div>

{% endblock %}
