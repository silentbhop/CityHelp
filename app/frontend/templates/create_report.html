{% extends "base.html" %}

{% block title %}Новая заявка — CityHelp{% endblock %}

{% block content %}
<div class="container">

    <a href="/reports" class="back">← Все заявки</a>

    <div class="page-header" style="text-align:center;">
        <div>
            <h1 class="page-title">Новая заявка</h1>
            <p class="page-subtitle">Расскажите о проблеме</p>
        </div>
    </div>

    {% if error %}
    <div class="alert alert-error">
        {{ error }}
    </div>
    {% endif %}

    <div class="form-center">
        <div class="auth-card form-card">
            <form method="post" action="/reports/create">

                <div class="form-group">
                    <label for="title">Заголовок</label>
                    <input type="text" id="title" name="title"
                           placeholder="Кратко опишите проблему"
                           required minlength="3" maxlength="100">
                </div>

                <div class="form-group">
                    <label for="category_id">Категория</label>
                    <select id="category_id" name="category_id" required>
                        <option value="" disabled selected>Выберите категорию</option>
                        {% for category in categories %}
                            <option value="{{ category.id }}">{{ category.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="address">Адрес</label>
                    <input type="text" id="address" name="address"
                           placeholder="ул. Пушкина, д. 10"
                           required minlength="5" maxlength="255">
                </div>

                <div class="form-group">
                    <label for="description">Описание</label>
                    <textarea id="description" name="description"
                              placeholder="Подробно опишите проблему"
                              required minlength="5" maxlength="1500"></textarea>
                </div>

                <div class="report-footer">
                    <a href="/reports" class="btn btn-ghost">Отмена</a>
                    <button type="submit" class="btn btn-primary">Отправить заявку</button>
                </div>

            </form>
        </div>
    </div>

</div>
{% endblock %}
