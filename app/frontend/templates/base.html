<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CityHelp{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  {% block head %}{% endblock %}
</head>
<body>

<nav class="navbar">
  <a href="/reports" class="navbar-brand">
    <div class="navbar-logo">CH</div>
    CityHelp
  </a>

  <div class="navbar-nav">
    {% if user %}
    <a href="/reports/my" class="navbar-link">Мои заявки</a>
      <div class="navbar-divider"></div>
      {% if user.role.value == "admin" %}
        <a href="/admin" class="navbar-link amber">⚙ Панель</a>
      {% endif %}
      <a href="/profile" class="navbar-link">{{ user.username }}</a>
      <a href="/logout" class="navbar-link red">Выйти</a>
    {% else %}
      <a href="/login" class="navbar-link">Войти</a>
      <a href="/register" class="navbar-btn">Регистрация</a>
    {% endif %}
  </div>
</nav>

<div class="container">
  {% block content %}{% endblock %}
</div>

<script>
  // Авторасширение textarea
  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  function initAutoResize() {
    document.querySelectorAll('textarea').forEach(function(ta) {
      // Начальное состояние
      autoResize(ta);
      // При вводе
      ta.addEventListener('input', function() {
        autoResize(this);
      });
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAutoResize);
  } else {
    initAutoResize();
  }
</script>

</body>
</html>
