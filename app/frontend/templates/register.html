{% extends "base.html" %}
{% block title %}Регистрация — CityHelp{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">

    <a href="/reports" class="auth-card-logo">
      <div class="navbar-logo">CH</div>
      CityHelp
    </a>

    <h1>Создать аккаунт</h1>
    <p class="auth-card-sub">Заполните данные для регистрации</p>

    {% if error %}
      <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="post">
      <div class="form-group">
        <label for="username">Имя пользователя</label>
        <input type="text" id="username" name="username"
               minlength="3" maxlength="30" required autofocus autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">
          Пароль
          <span style="font-weight:400; color:var(--text3);">(минимум 6 символов)</span>
        </label>
        <input type="password" id="password" name="password"
               minlength="6" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-dark"
              style="width:100%; justify-content:center; margin-top:6px;">
        Создать аккаунт
      </button>
    </form>

    <div class="auth-card-foot">
      Уже есть аккаунт? <a href="/login">Войти</a>
    </div>

  </div>
</div>
{% endblock %}
